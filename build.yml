# Compila o APK na nuvem do GitHub (não precisas de Android Studio nem de nada instalado).
# Separador "Actions" -> "Compilar APK" -> no fim descarrega o artefacto "mapa-offline-apk".
name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          sudo apt-get install -y libtinfo5 || true
          pip install --upgrade pip
          pip install buildozer "cython<3" setuptools

      - name: Cache do SDK/NDK (acelera as compilações seguintes)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Compilar
        run: buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: mapa-offline-apk
          path: bin/*.apk
